site_name: FinLab Research Assistant
site_description: >-
  Technical documentation for the FinLab Research Assistant — an SEC/EDGAR 10-K
  ingestion, parsing, chunking, and embedding pipeline for investment research.
site_url: https://karandeeps18.github.io/finlab-research-assistant/
site_author: Karandeep

repo_name: karandeeps18/finlab-research-assistant
repo_url: https://github.com/karandeeps18/finlab-research-assistant
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  status:
    done: Implemented
    partial: Partial
    stub: Stub / planned

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Pipeline:
      - Ingestion: pipeline/ingestion.md
      - Parsing: pipeline/parsing.md
      - Chunking: pipeline/chunking.md
      - Embedding: pipeline/embedding.md
  - Data Model: data-model.md
  - Configuration: configuration.md
  - Running It: running.md
  - Design Decisions: design-decisions.md
  - Current State: current-state.md
  - Roadmap: roadmap.md
  - Vision: vision.md
